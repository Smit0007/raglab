spring.application.name=raglab-backend
server.port=8080
management.endpoints.web.exposure.include=health,info

# PostgreSQL Datasource Configuration (Defaults to dev docker-compose host port 5433)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:raglab}
spring.datasource.username=${DB_USER:raglab}
spring.datasource.password=${DB_PASSWORD:raglab_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Migration Settings
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
