name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-and-rcache:
    name: Backend & RCache (Java / Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test (Backend + RCache)
        run: mvn clean verify

      - name: Verify zero Redis dependency
        run: |
          echo "Verifying zero Redis dependencies in Maven dependency tree..."
          mvn dependency:tree | grep -i "redis\|lettuce\|jedis" && exit 1 || echo "Zero Redis dependency verified!"

  frontend:
    name: Frontend (Next.js / TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test

      - name: Run Linter
        run: npm run lint

      - name: Build Next.js Application
        run: npm run build
